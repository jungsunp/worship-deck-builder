<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Worship Deck — 검토</title>
<link rel="icon" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/app.css">
<style>
  body { padding-bottom: calc(6rem + var(--safe-bottom)); }  /* keep content above stickybar */
  .hint { color: var(--gray-600); font-size: 0.85rem; margin: 0.25rem 0 0.75rem; }
  /* Worship-order rows that carry no editor (기도, 축도, …) stay as plain compact rows. */
  .row { border: 1px solid var(--gray-100); border-radius: var(--radius);
         padding: 0.5rem 0.75rem; margin: 0.5rem 0; }
  .part { font-weight: 600; } .meta { color: var(--gray-600); font-size: 0.85rem; }
  /* Collapsible section card: whole header is the ≥44px toggle target. */
  .seccard { padding: 0; scroll-margin-top: 60px; }  /* clear the sticky chips on jump */
  .sechead { display: flex; align-items: center; gap: 0.5rem; min-height: 44px;
             box-sizing: border-box; padding: var(--space-2) var(--space-3); cursor: pointer; }
  .sechead .caret { color: var(--gray-500); font-size: 0.8rem; flex: none; }
  .sechead .part { flex: none; }
  .sechead .meta { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
                   white-space: nowrap; }
  .sechead .badge { flex: none; }
  .secbody { padding: 0 var(--space-3) var(--space-3); }
  .song { border-top: 1px solid var(--gray-100); margin-top: 0.5rem; padding-top: 0.5rem; }
  .song .hd { display: flex; align-items: center; gap: 0.5rem; }
  .song .hd input { flex: 1; width: auto; min-width: 0; }
  .song .hd button { width: auto; padding: 0.3rem 0.6rem; font-size: 1rem; border: 0;
                     border-radius: var(--radius); background: var(--blue); color: #fff; }
  .song .libsave { width: auto; margin-top: 0.5rem; padding: 0.5rem 0.8rem; font-size: 0.95rem;
                   border: 1px solid var(--green); border-radius: var(--radius);
                   background: #fff; color: var(--green); }
  /* 찬양 medley: one tab per song, panels stay in DOM (hidden) so save sees all edits. */
  .tabs { display: flex; gap: 0.4rem; overflow-x: auto; -webkit-overflow-scrolling: touch;
          margin-top: 0.5rem; }
  .tab { flex: none; max-width: 12em; overflow: hidden; text-overflow: ellipsis;
         white-space: nowrap; padding: 0.45rem 0.8rem; font-size: 0.95rem;
         border: 1px solid var(--gray-200); border-radius: 999px; background: #fff; }
  .tab.active { background: var(--blue); border-color: var(--blue); color: #fff; }
  /* 찬양 sections + arrangement (#113): operator-labeled section cards, then a typed play-order. */
  .lcard { border: 1px solid var(--gray-200); border-radius: var(--radius); padding: 0.5rem;
           margin-top: 0.5rem; background: #fff; }
  /* Auto-grows to the full lyrics (so selection is easy) but stays drag-resizable. */
  .lcard textarea { resize: vertical; overflow: auto; }
  .cardhd { display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.4rem; }
  .cardhd select { width: auto; flex: none; padding: 0.3rem 0.4rem; font-size: 0.95rem;
                   font-weight: 600; }
  .cardhd .sp { flex: 1; }
  .cardhd button { width: auto; border: 0; background: transparent; padding: 0.2rem 0.4rem;
                   font-size: 1rem; line-height: 1; color: var(--gray-600); }
  .cardhd button.x { color: var(--red); }
  .splitbtn { width: auto; margin-top: 0.4rem; padding: 0.3rem 0.6rem; font-size: 0.85rem;
              border: 1px dashed var(--gray-300); border-radius: var(--radius);
              background: #fff; color: var(--gray-700); }
  .addcard { width: auto; margin-top: 0.5rem; padding: 0.4rem 0.8rem; font-size: 0.9rem;
             border: 1px dashed var(--gray-300); border-radius: var(--radius);
             background: #fff; color: var(--gray-700); }
  /* Lyric provenance badge (#200): gasazip match (green, with score) vs local OCR fallback (amber). */
  .provrow { margin: 0.4rem 0; }
  .prov { display: inline-block; padding: 0.2rem 0.6rem; font-size: 0.85rem;
          border-radius: 999px; border: 1px solid currentColor; text-decoration: none; }
  .prov.ok { color: var(--green); }
  .prov.warn { color: var(--amber); }
  .arr { margin-top: 0.8rem; }
  .arrhint { color: var(--gray-600); font-size: 0.85rem; margin-bottom: 0.4rem; }
  .arrhint b { color: var(--gray-700); }
  .arrlabel { font-size: 0.8rem; color: var(--gray-600); font-weight: 600; margin-bottom: 0.3rem; }
  /* Play-order built by tapping labels: drag the ⠿ grip to reorder, corner ✕ removes. Repeat a
     section live by adding its label again (no ×N counter — keeps the deck small, #113). */
  .flow { display: flex; flex-wrap: wrap; gap: 0.55rem 0.5rem; align-items: center; min-height: 2rem; }
  .flowempty { color: var(--gray-500); font-size: 0.85rem; }
  .fchip { position: relative; display: inline-flex; align-items: center; border: 1px solid var(--blue);
           border-radius: 999px; background: var(--blue); color: #fff; padding: 0.05rem 0.7rem 0.05rem 0.15rem; }
  .fchip.dragging { opacity: 0.5; }
  .fchip .grip { cursor: grab; touch-action: none; color: rgba(255,255,255,0.8); font-size: 0.9rem;
                 padding: 0.3rem 0.25rem 0.3rem 0.4rem; line-height: 1; user-select: none; }
  .fchip .lab { font-weight: 600; padding: 0 0.1rem; font-size: 0.95rem; }
  .fchip .rm { position: absolute; top: -0.45rem; right: -0.45rem; width: 1.05rem; height: 1.05rem;
               padding: 0; border-radius: 999px; background: var(--red); color: #fff; border: 1px solid #fff;
               font-size: 0.7rem; line-height: 1rem; text-align: center; }
  .picklabel { font-size: 0.8rem; color: var(--gray-600); margin: 0.5rem 0 0.2rem; }
  .pick { margin-top: 0.2rem; display: flex; flex-wrap: wrap; gap: 0.3rem; }
  .pick button { width: auto; padding: 0.3rem 0.7rem; font-size: 0.95rem; font-weight: 600;
                 border: 1px solid var(--blue); border-radius: 999px; background: #fff;
                 color: var(--blue); }
  .arrout { color: var(--gray-600); font-size: 0.85rem; margin-top: 0.4rem; }
  .arrwarn { color: var(--red); font-size: 0.85rem; margin-top: 0.3rem; }
  textarea, input { width: 100%; font-size: 1rem; box-sizing: border-box; }
  textarea { min-height: 3.5rem; overflow: hidden; resize: none; }  /* auto-grow (#112) */
  input { padding: 0.5rem; margin: 0.25rem 0; }
  .passage { white-space: pre-wrap; font-size: 0.95rem; margin-bottom: 0.5rem; }
  .vlabel { color: var(--gray-600); font-size: 0.8rem; font-weight: 600; margin-top: 0.5rem; }
  .subhd { font-weight: 600; margin-top: 0.75rem; border-top: 1px solid var(--gray-100);
           padding-top: 0.5rem; }
  .hymngrid { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }
  .hymnthumb { position: relative; width: 30%; cursor: pointer; border: 2px solid var(--green);
               border-radius: 6px; overflow: hidden; }
  .hymnthumb img { display: block; width: 100%; }
  .hymnthumb.dropped { border-color: var(--gray-200); opacity: 0.5; filter: grayscale(1); }
  .hymnthumb .badge { position: absolute; top: 0; right: 0; padding: 0.1rem 0.4rem;
                      font-size: 0.75rem; color: #fff; background: var(--green); }
  .hymnthumb.dropped .badge { background: var(--gray-500); }
  .hymncount { color: var(--gray-600); font-size: 0.85rem; margin-top: 0.4rem; }
  #status { color: var(--gray-600); white-space: pre-wrap; }
  #status.err { color: var(--red); border-color: var(--red); }
  .pdf-link { display: inline-block; margin-top: 0.5rem; padding: 0.5rem 0;
              color: var(--blue); font-weight: 600; text-decoration: underline; }
  .stickybar #generate { background: var(--purple); }
  .stickybar #generate:disabled { background: #c4b5fd; }
  a { color: var(--blue); }
</style>
</head>
<body>
<a href="/">← 홈</a>
<h1><span id="date"></span> 검토</h1>
<div class="stepper">
  <span class="step" data-step="upload"><span class="dot">○</span>업로드</span>
  <span class="sep"></span>
  <span class="step" data-step="assemble"><span class="dot">○</span>Assemble</span>
  <span class="sep"></span>
  <span class="step" data-step="review"><span class="dot">○</span>검토</span>
  <span class="sep"></span>
  <span class="step" data-step="build"><span class="dot">○</span>빌드</span>
</div>
<div class="chips" id="chips"></div>
<div class="card" id="status" hidden></div>
<div class="card warn" id="warnCard" hidden></div>
<p class="hint">전체 예배 순서대로 — 성가대 · 봉헌 · 광고는 해당 순서 자리에서 편집합니다.</p>
<div id="order"></div>

<div class="stickybar">
  <button type="button" class="secondary" id="save" onclick="save()">저장</button>
  <button type="button" id="generate" onclick="generate()">덱 생성</button>
</div>
<script>
const date = location.pathname.split('/').pop();
const dm = date.match(/^\d{4}-(\d{2})-(\d{2})$/);
document.getElementById('date').textContent = dm ? Number(dm[1]) + '월 ' + Number(dm[2]) + '일' : date;
let run = null;

function fmtDur(s) {
  const m = Math.floor(s / 60), sec = Math.round(s % 60);
  return m ? m + '분 ' + sec + '초' : sec + '초';
}
const DOTS = {empty: '○', active: '◐', done: '●', error: '✕'};
function setStep(name, state) {
  const el = document.querySelector('.step[data-step="' + name + '"]');
  el.className = 'step' + (state === 'empty' ? '' : ' ' + state);
  el.querySelector('.dot').textContent = DOTS[state];
}
setStep('upload', 'done'); setStep('assemble', 'done'); setStep('review', 'active');

function showStatus(text, isErr) {
  const el = document.getElementById('status');
  el.hidden = false;
  el.textContent = text;
  el.classList.toggle('err', !!isErr);
}
function showWarn(text) {
  const el = document.getElementById('warnCard');
  el.hidden = false;
  el.textContent = text.split('\n').map(w => '⚠ ' + w).join('\n');
  el.scrollIntoView({behavior: 'smooth', block: 'center'});
}

async function load() {
  const r = await fetch('/runs/' + date);
  if (!r.ok) { showStatus('✕ 불러오기 오류: ' + r.status, true); return; }
  run = await r.json();
  try { customLabels = (await (await fetch('/api/labels')).json()).labels || []; } catch (e) { /* offline: dropdown still has the defaults */ }
  render();
}

// Identify which section a worship-order row carries, so its editor renders inline (mirrors
// the Python row predicates: the two 찬양 rows are told apart by the 성가대 leader/title).
const pk = row => (row.part || '').replace(/\s/g, '');
const hasChoir = row => ((row.title || '') + (row.leader || '')).includes('성가대');
const isOpening = row => pk(row) === '찬양' && !hasChoir(row);
const isChoir = row => pk(row) === '찬양' && hasChoir(row);
const isConfession = row => pk(row) === '고백의찬양';
const isHymn = row => pk(row) === '봉헌';
const isAnnounce = row => pk(row) === '교회소식';
const isCtw = row => pk(row) === '예배의부름';
const isSermon = row => pk(row) === '말씀';

// Section cards (#133): chip label, default-expanded (editors the operator likely needs),
// and the "no content" predicate behind the ⚠ badge. Missing sections always start expanded.
const SECTIONS = [
  {key: 'opening', chip: '찬양', match: isOpening, render: renderMedley, open: true,
   missing: () => !(run.worship_songs || []).length},
  {key: 'ctw', chip: '부름', match: isCtw, open: false,
   render: d => renderPassage(d, run.call_to_worship_passage),
   missing: () => !(run.call_to_worship_passage || []).length},
  {key: 'confession', chip: '고백', match: isConfession, render: renderConfession, open: false,
   missing: () => !(run.confession_song && run.confession_song.title)},
  {key: 'choir', chip: '성가대', match: isChoir, render: renderChoir, open: false,
   missing: () => !(run.choir_song && run.choir_song.title)},
  {key: 'hymn', chip: '봉헌', match: isHymn, render: renderHymn, open: true,
   missing: () => !run.offering_hymn_number && !(run.offering_hymn_images || []).length},
  {key: 'announce', chip: '소식', match: isAnnounce, render: renderAnnounce, open: false,
   missing: () => !(run.announcements || []).length},
  {key: 'sermon', chip: '말씀', match: isSermon, render: renderSermon, open: false,
   missing: () => !(run.sermon_passage || []).length},
  // 설교후 찬양 isn't a bulletin worship-order row — match() never fires; render() injects it
  // manually right after the 말씀 card (its slides land after the sermon in the deck).
  {key: 'sermonsong', chip: '설교후', match: () => false, render: renderSermonSong, open: false,
   missing: () => !(run.worship_after_sermon && run.worship_after_sermon.title)},
];
const SERMONSONG_SEC = SECTIONS.find(s => s.key === 'sermonsong');
const edited = {};     // key → operator touched the section this visit (✎ badge)
const collapsed = {};  // key → card collapsed; seeded on first render, then operator-owned

function rowMeta(row) { return [row.title, row.leader, row.ref].filter(Boolean).join(' · '); }

function render() {
  const order = document.getElementById('order');
  order.innerHTML = '';
  const wo = run.worship_order;
  const sermonIdx = wo.findIndex(isSermon);
  // A 찬양 row after the 말씀 row is the (optional) 설교후 찬양 — its lyrics come from the operator's
  // upload/typed text (worship_after_sermon), NOT the opening medley. Route it to the 설교후 찬양
  // editor so it isn't rendered as a second opening-medley card (#duplicate).
  const postSermonSongIdx = sermonIdx >= 0 ? wo.findIndex((r, i) => i > sermonIdx && isOpening(r)) : -1;
  wo.forEach((row, i) => {
    if (i === postSermonSongIdx) {
      order.appendChild(sectionCard(SERMONSONG_SEC, row));
      return;
    }
    const sec = SECTIONS.find(s => s.match(row));
    order.appendChild(sec ? sectionCard(sec, row) : plainRow(row));
    // Fallback: the bulletin has no post-sermon 찬양 row, but the operator added a 설교후 찬양 anyway —
    // show it right after the 말씀 card. Most weeks there's no song, so nothing renders here.
    if (sec && sec.key === 'sermon' && postSermonSongIdx < 0
        && run.worship_after_sermon && run.worship_after_sermon.title) {
      order.appendChild(sectionCard(SERMONSONG_SEC, {part: '설교후 찬양'}));
    }
  });
  renderChips();
  growVisible();
}

function plainRow(row) {
  const div = document.createElement('div'); div.className = 'row';
  const part = document.createElement('span'); part.className = 'part';
  part.textContent = row.part || '';
  const meta = document.createElement('span'); meta.className = 'meta';
  meta.textContent = rowMeta(row);
  div.append(part, ' ', meta);
  return div;
}

function sectionCard(sec, row) {
  if (!(sec.key in collapsed)) collapsed[sec.key] = !(sec.open || sec.missing());
  const card = document.createElement('div');
  card.className = 'card seccard'; card.id = 'sec-' + sec.key;
  const head = document.createElement('div'); head.className = 'sechead';
  head.onclick = () => toggleSec(sec.key);
  const caret = document.createElement('span'); caret.className = 'caret';
  caret.textContent = collapsed[sec.key] ? '▶' : '▼';
  const part = document.createElement('span'); part.className = 'part';
  part.textContent = row.part || '';
  const meta = document.createElement('span'); meta.className = 'meta';
  meta.textContent = rowMeta(row);
  const badge = document.createElement('span');
  head.append(caret, part, meta, badge);
  const body = document.createElement('div'); body.className = 'secbody';
  body.id = 'body-' + sec.key;
  body.hidden = collapsed[sec.key];
  sec.render(body);
  body.addEventListener('input', () => markEdited(sec.key));
  card.append(head, body);
  setBadge(badge, sec);
  return card;
}

function setBadge(el, sec) {
  if (edited[sec.key]) { el.className = 'badge edit'; el.textContent = '✎'; }
  else if (sec.missing()) { el.className = 'badge warn'; el.textContent = '⚠'; }
  else { el.className = 'badge ok'; el.textContent = '✓'; }
}
function markEdited(key) {
  if (edited[key]) return;
  edited[key] = true;
  const el = document.querySelector('#sec-' + key + ' .sechead .badge');
  if (el) setBadge(el, SECTIONS.find(s => s.key === key));
}

function toggleSec(key) {
  collapsed[key] = !collapsed[key];
  const body = document.getElementById('body-' + key);
  body.hidden = collapsed[key];
  document.querySelector('#sec-' + key + ' .caret').textContent = collapsed[key] ? '▶' : '▼';
  if (!collapsed[key]) body.querySelectorAll('textarea').forEach(autogrow);
}
function jumpTo(key) {
  if (collapsed[key]) toggleSec(key);
  document.getElementById('sec-' + key).scrollIntoView({behavior: 'smooth', block: 'start'});
}
function renderChips() {
  const bar = document.getElementById('chips');
  bar.innerHTML = '';
  document.querySelectorAll('#order .seccard').forEach(card => {
    const sec = SECTIONS.find(s => 'sec-' + s.key === card.id);
    const b = document.createElement('button'); b.type = 'button'; b.className = 'chip';
    b.textContent = sec.chip;
    b.onclick = () => jumpTo(sec.key);
    bar.appendChild(b);
  });
}

// Auto-grow textareas (#112): the whole song is visible — no inner scroll, no manual resize.
// Grown on input, after render, and when a collapsed section (scrollHeight 0) is expanded.
function autogrow(ta) { ta.style.height = 'auto'; ta.style.height = (ta.scrollHeight + 4) + 'px'; }
function growVisible() {
  document.querySelectorAll('#order .secbody:not([hidden]) textarea').forEach(autogrow);
}
document.getElementById('order').addEventListener('input', e => {
  if (e.target.tagName === 'TEXTAREA') autogrow(e.target);
});

// One tab per song; only the active song's editor shows. All panels stay in the DOM
// (hidden) so syncFromDom round-trips every song's edits regardless of the active tab.
let medleyTab = 0;
function renderMedley(div) {
  const songs = run.worship_songs || [];
  if (!songs.length) return;
  if (medleyTab >= songs.length) medleyTab = 0;
  const tabs = document.createElement('div'); tabs.className = 'tabs';
  div.appendChild(tabs);
  const panels = [];
  songs.forEach((song, s) => {
    const tab = document.createElement('button'); tab.type = 'button';
    tab.className = 'tab' + (s === medleyTab ? ' active' : '');
    tab.textContent = song.title || '(제목 없음)';
    tab.onclick = () => {
      medleyTab = s;
      tabs.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === s));
      panels.forEach((p, i) => { p.hidden = i !== s; });
      panels[s].querySelectorAll('textarea').forEach(autogrow);  // scrollHeight was 0 while hidden
    };
    tabs.appendChild(tab);
    const sd = document.createElement('div'); sd.className = 'song';
    sd.hidden = s !== medleyTab;
    const hd = document.createElement('div'); hd.className = 'hd';
    const ti = document.createElement('input');
    ti.dataset.kind = 'worship-title'; ti.dataset.i = s;
    ti.placeholder = '곡 제목'; ti.value = song.title || '';
    ti.addEventListener('input', () => { tab.textContent = ti.value || '(제목 없음)'; });
    const up = document.createElement('button'); up.textContent = '▲'; up.onclick = () => move(s, -1);
    const dn = document.createElement('button'); dn.textContent = '▼'; dn.onclick = () => move(s, 1);
    hd.append(ti, up, dn); sd.appendChild(hd);
    appendProvRow(sd, song);  // lyric origin badge (#200)
    // Start unlabeled lyrics as one V1 card so the operator always has something to split/label.
    if (!song.sections || !song.sections.length) {
      song.sections = [{label: 'V1', lines: (song.lines || []).slice()}];
    }
    const cardsHost = document.createElement('div');
    cardsHost.className = 'cards'; cardsHost.dataset.i = s;
    sd.appendChild(cardsHost);
    const add = document.createElement('button'); add.type = 'button';
    add.className = 'addcard'; add.textContent = '＋ 구간';
    add.onclick = () => { readCards(s); song.sections.push({label: '', lines: []}); bump(s); };
    sd.appendChild(add);
    const arr = document.createElement('div'); arr.className = 'arr'; arr.dataset.i = s;
    sd.appendChild(arr);
    renderCards(cardsHost, s);    // render into the refs directly — sd isn't in the document yet,
    renderArrangement(arr, s);    // so refreshSong's #order querySelector would find nothing here
    panels.push(sd);
    div.appendChild(sd);
  });
}

// Section-card editor (#113). The operator labels lyric groups (V1/C/PC/B…) themselves — online/
// 14b lyrics carry no structure — and types a play-order string that sequences the labels with ×N
// repeats. The OCR-read arrangement string is shown only as a non-binding hint.
const LABEL_OPTS = ['V1', 'V2', 'V3', 'V4', 'PC', 'C', 'B', 'Intro', '간주', 'Tag', 'Ending'];
let customLabels = [];  // labels typed via 직접입력, persisted server-side and reused across weeks

// The section-card editor is shared by three single-or-medley song sections. `ref` selects the
// target song: a numeric index into the 찬양 medley, or a string key for the single-song sections
// (고백의 찬양 / 설교후 찬양). The .cards[data-i] selectors work for both (string or numeric).
function songByRef(ref) {
  if (ref === 'confession') return run.confession_song;
  if (ref === 'sermonsong') return run.worship_after_sermon || (run.worship_after_sermon = {});
  return run.worship_songs[ref];
}
const editKeyOf = ref => (ref === 'confession' ? 'confession'
                        : ref === 'sermonsong' ? 'sermonsong' : 'opening');

// Provenance badge (#200): where a song's lyrics came from, so the operator knows what to trust.
// gasazip match → green pill linking to the source, with both coverage %s (low on either = worth
// proofreading). Local OCR+Ollama fallback → amber ⚠ flag. Typed/library songs → no badge.
// Reads run data (not DOM), so it survives the medley tab round-trip; syncFromDom never writes it.
function provBadge(song) {
  const p = (song && song.provenance) || {};
  if (p.source === 'gasazip') {
    const a = document.createElement('a');
    a.className = 'prov ok'; a.href = 'https://gasazip.com/' + p.song_id;
    a.target = '_blank'; a.rel = 'noopener';
    const pct = c => Math.round((c || 0) * 100);
    a.textContent = `가사집 ✓ ${p.artist || ''} · 일치 ${pct(p.cand_cov)}% · 악보 ${pct(p.ocr_cov)}%`;
    return a;
  }
  if (p.source === 'local') {
    const s = document.createElement('span');
    s.className = 'prov warn'; s.title = '자동 복원된 가사 — 직접 확인 필요';
    s.textContent = 'OCR 복원 ⚠︎';
    return s;
  }
  return null;
}

// Read every card's label + lines from the DOM into song.sections (DOM is the truth for typed
// text; structural ops call this first so unsaved typing survives a re-render).
function readCards(s) {
  const host = document.querySelector('#order .cards[data-i="' + s + '"]');
  if (!host) return;
  const secs = [];
  host.querySelectorAll('.lcard').forEach(card => {
    const sel = card.querySelector('select');
    const ta = card.querySelector('textarea');
    secs.push({label: sel.value === '__custom' ? '' : sel.value, lines: splitKeepBlanks(ta.value)});
  });
  songByRef(s).sections = secs;
}

// Re-render a song's cards + arrangement after a structural change.
function refreshSong(s) {
  renderCards(document.querySelector('#order .cards[data-i="' + s + '"]'), s);
  renderArrangement(document.querySelector('#order .arr[data-i="' + s + '"]'), s);
}
const bump = s => { edited[editKeyOf(s)] = true; refreshSong(s); };

function renderCards(host, s) {
  const song = songByRef(s);
  host.innerHTML = '';
  song.sections.forEach((sec, ci) => {
    const card = document.createElement('div'); card.className = 'lcard';
    const cardhd = document.createElement('div'); cardhd.className = 'cardhd';
    const sel = document.createElement('select');
    const opts = LABEL_OPTS.concat(customLabels.filter(l => !LABEL_OPTS.includes(l)));  // + saved 직접입력 labels
    if (sec.label && !opts.includes(sec.label)) opts.unshift(sec.label);  // keep this card's custom/OCR label
    opts.forEach(o => { const op = document.createElement('option'); op.value = o; op.textContent = o; sel.appendChild(op); });
    const cu = document.createElement('option'); cu.value = '__custom'; cu.textContent = '직접입력…'; sel.appendChild(cu);
    sel.value = sec.label || '';
    sel.onchange = () => {
      if (sel.value === '__custom') {
        const v = (prompt('구간 라벨 (예: V5, Tag2)') || '').trim();
        if (v && !LABEL_OPTS.includes(v) && !customLabels.includes(v)) {  // remember for future runs
          customLabels.push(v);
          fetch('/api/labels', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({label: v})}).catch(() => {});
        }
        readCards(s); song.sections[ci].label = v; bump(s);
      } else { readCards(s); edited[editKeyOf(s)] = true; renderArrangement(host.parentElement.querySelector('.arr'), s); }
    };
    const sp = document.createElement('span'); sp.className = 'sp';
    const mk = (txt, cls, fn) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = txt; if (cls) b.className = cls; b.onclick = fn; return b; };
    const ta = document.createElement('textarea');
    ta.value = (sec.lines || []).join('\n');
    cardhd.append(
      sel, sp,
      mk('▲', '', () => { readCards(s); if (ci > 0) { [song.sections[ci - 1], song.sections[ci]] = [song.sections[ci], song.sections[ci - 1]]; bump(s); } }),
      mk('▼', '', () => { readCards(s); if (ci < song.sections.length - 1) { [song.sections[ci + 1], song.sections[ci]] = [song.sections[ci], song.sections[ci + 1]]; bump(s); } }),
      mk('✕', 'x', () => {
        readCards(s);
        if (song.sections.length <= 1) return;          // keep at least one card
        const tgt = ci > 0 ? ci - 1 : 1;                // merge lines up (or into next for the first)
        song.sections[tgt].lines = ci > 0
          ? song.sections[tgt].lines.concat(song.sections[ci].lines)
          : song.sections[ci].lines.concat(song.sections[tgt].lines);
        song.sections.splice(ci, 1); bump(s);
      }),
    );
    card.appendChild(cardhd);
    card.appendChild(ta);
    autogrow(ta);
    const split = mk('여기서 나누기', 'splitbtn', () => {
      const lineIdx = ta.value.slice(0, ta.selectionStart).split('\n').length - 1;  // cursor's line
      const all = ta.value.split('\n');
      const top = splitKeepBlanks(all.slice(0, lineIdx).join('\n'));
      const bottomLines = splitKeepBlanks(all.slice(lineIdx).join('\n'));
      if (!top.length || !bottomLines.length) return;   // nothing to split
      readCards(s);
      const label = song.sections[ci].label;  // current DOM label — closure `sec` goes stale when
      song.sections.splice(ci, 1, {label, lines: top}, {label: '', lines: bottomLines});  // the
      bump(s);                                 // dropdown changes without a card re-render (#387)
    });
    card.appendChild(split);
    host.appendChild(card);
  });
}

// transcribe.chunk in JS: blank line breaks a slide, <=2 non-blank lines per slide.
function chunkCountLines(lines) {
  let slides = 0, cur = 0;
  (lines || []).forEach(l => {
    if (!l.trim()) { if (cur) { slides++; cur = 0; } }
    else { cur++; if (cur === 2) { slides++; cur = 0; } }
  });
  return slides + (cur ? 1 : 0);
}
// transcribe.parse_arrangement in JS: "V1 C V1 C" -> ["V1","C","V1","C"] (a label per played slide-
// group; repeat a label to repeat the section — no ×N counter).
function parseArr(str) {
  return (str || '').trim().split(/[-\s]+/).filter(Boolean);
}

// Serialize a [label,...] sequence back to the stored arrangement string ("V1 C V1 C").
const serializeSeq = seq => seq.join(' ');

// Pointer-based drag-reorder for a chip's grip (HTML5 draggable doesn't fire on touch). While
// dragging we move the chip in the DOM relative to whatever chip the pointer is over; on release
// commit() rebuilds the order from the chips' final DOM positions.
function startDrag(grip, chip, flow, commit) {
  grip.addEventListener('pointerdown', e => {
    e.preventDefault();
    chip.classList.add('dragging');
    const move = ev => {
      const over = document.elementFromPoint(ev.clientX, ev.clientY);
      const target = over && over.closest ? over.closest('.fchip') : null;
      if (!target || target === chip || target.parentElement !== flow) return;
      const r = target.getBoundingClientRect();
      const after = ev.clientX > r.left + r.width / 2;
      flow.insertBefore(chip, after ? target.nextSibling : target);
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      chip.classList.remove('dragging');
      commit();
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  });
}

// Play-order is built by TAPPING labels, not typing (#113 feedback): each step is a compact blue
// chip — a ⠿ grip drag-reorders (pointer events so it works on touch) and a small corner ✕ removes.
// There is no ×N counter: to repeat a section the operator taps its label again (V1 V1 V1) — one
// slide per tap keeps the deck small; the operator holds a repeated slide live, watching the band
// sheet. The result serializes into song.arrangement (a string). Empty order = sections once in order.
function renderArrangement(host, s) {
  if (!host) return;
  const song = songByRef(s);
  host.innerHTML = '';
  if (song.arrangement_hint) {
    const h = document.createElement('div'); h.className = 'arrhint';
    h.append('악보 표기: '); const b = document.createElement('b'); b.textContent = song.arrangement_hint;
    h.append(b, ' (참고용 · 자동 적용 안 함)'); host.appendChild(h);
  }
  const lab = document.createElement('div'); lab.className = 'arrlabel'; lab.textContent = '진행 순서';
  host.appendChild(lab);
  const seq = parseArr(song.arrangement);
  const apply = next => { song.arrangement = serializeSeq(next); edited[editKeyOf(s)] = true; renderArrangement(host, s); };
  const mk = (txt, cls, fn) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = txt; if (cls) b.className = cls; b.onclick = fn; return b; };
  const flow = document.createElement('div'); flow.className = 'flow';
  if (!seq.length) {
    const e = document.createElement('span'); e.className = 'flowempty';
    e.textContent = '아래 라벨을 눌러 순서를 만드세요 (비우면 구간 순서대로 1번씩)'; flow.appendChild(e);
  }
  // Rebuild seq from the chips' current DOM order (used after a drag) and re-apply.
  const commitOrder = () => apply([...flow.querySelectorAll('.fchip')].map(el => el.dataset.label));
  seq.forEach((l, i) => {
    const chip = document.createElement('span'); chip.className = 'fchip';
    chip.dataset.label = l;
    const grip = document.createElement('span'); grip.className = 'grip'; grip.textContent = '⠿';
    startDrag(grip, chip, flow, commitOrder);
    const lb = document.createElement('span'); lb.className = 'lab'; lb.textContent = l;
    const rm = mk('✕', 'rm', () => { const u = seq.slice(); u.splice(i, 1); apply(u); });
    chip.append(grip, lb, rm);
    flow.appendChild(chip);
  });
  host.appendChild(flow);
  const pl = document.createElement('div'); pl.className = 'picklabel'; pl.textContent = '라벨 추가 (반복하려면 다시 누르세요)'; host.appendChild(pl);
  const pick = document.createElement('div'); pick.className = 'pick';
  const seen = new Set();
  song.sections.forEach(sec => {
    const l = (sec.label || '').trim(); if (!l || seen.has(l)) return; seen.add(l);
    pick.appendChild(mk('＋ ' + l, '', () => apply(seq.concat([l]))));
  });
  if (!seen.size) { const e = document.createElement('span'); e.className = 'flowempty'; e.textContent = '구간에 라벨을 먼저 지정하세요'; pick.appendChild(e); }
  host.appendChild(pick);
  const out = document.createElement('div'); out.className = 'arrout'; host.appendChild(out);
  const warn = document.createElement('div'); warn.className = 'arrwarn'; host.appendChild(warn);
  const byLabel = {};
  song.sections.forEach(sec => { const k = (sec.label || '').toUpperCase(); if (k && !(k in byLabel)) byLabel[k] = sec.lines; });
  const played = seq.length ? seq : song.sections.map(sec => sec.label);
  let total = 0; const unknown = [];
  played.forEach(l => { const lines = byLabel[(l || '').toUpperCase()]; if (lines === undefined) { if (l) unknown.push(l); return; } total += chunkCountLines(lines); });
  out.textContent = '→ 가사 슬라이드 ' + total + '장';
  warn.textContent = unknown.length ? '⚠ 모르는 라벨: ' + [...new Set(unknown)].join(', ') : '';
}

async function saveConfessionToLibrary() {
  const get = sel => (document.querySelector('#order ' + sel)?.value || '').trim();
  const title = get('input[data-kind="confession-title"]');
  const composer = get('input[data-kind="confession-composer"]');

  const secs = run.confession_song.sections || [];
  const lines = secs.flatMap((sec, i) => i ? [''].concat(sec.lines) : sec.lines);
  if (!title) { showStatus('✕ 곡 제목을 입력해야 저장할 수 있습니다', true); return; }
  const btn = document.getElementById('libSave');
  const r = await fetch('/library/confession', {

  });

    btn.textContent = r.ok ? '라이브러리에 저장됨 ✓' : '저장 ✕';

}

// 고백의 찬양 / 설교후 찬양: a single song the operator can group into V1/C sections in review —
// the same section-card + arrangement editor as the 찬양 medley, minus only the medley tabs.
function renderLabeledSong(div, ref, libSave) {

  sd.append(ti, co);

  const cardsHost = document.createElement('div');
  cardsHost.className = 'cards'; cardsHost.dataset.i = ref;

  const add = document.createElement('button'); add.type = 'button';
  add.className = 'addcard'; add.textContent = '＋ 구간';
  add.onclick = () => { readCards(ref); song.sections.push({label: '', lines: []}); bump(ref); };
  sd.appendChild(add);
  if (libSave) {  // 고백의 찬양 rotates weekly — bank a polished song for next week's home picker.
    const lib = document.createElement('button');
    lib.id = 'libSave'; lib.type = 'button'; lib.className = 'libsave';
    lib.textContent = '라이브러리에 저장';

  renderArrangement(arr, ref);      // so refreshSong's #order querySelector would find nothing here
}

const splitLines = v => v.split('\n').map(s => s.trim()).filter(Boolean);
// Keeps interior blank lines (stanza breaks, #101) — trims only leading/trailing ones.
const splitKeepBlanks = v => {
  const a = v.split('\n').map(s => s.trim());
  while (a.length && !a[0]) a.shift();
  while (a.length && !a[a.length - 1]) a.pop();
  return a;
};

function syncFromDom() {
  document.querySelectorAll('#order .cards[data-i]').forEach(host => {
    const s = host.dataset.i, song = songByRef(s);  // s: numeric medley index or a section key
    readCards(s);  // DOM cards -> song.sections (label + lines, #113)
    // Flatten sections to lines (blank-line separated) as the legacy/fallback mirror.
    song.lines = song.sections.flatMap((sec, i) => i ? [''].concat(sec.lines) : sec.lines);
    // song.arrangement is kept current in memory by the chip-flow editor — nothing to read here.
  });
  document.querySelectorAll('#order input[data-kind="worship-title"]').forEach(ti => {
    run.worship_songs[ti.dataset.i].title = ti.value.trim();
  });
  const choirTa = document.querySelector('#order textarea[data-kind="choir"]');
  if (choirTa && run.choir_song) run.choir_song.lines = splitKeepBlanks(choirTa.value);
  const choirTi = document.querySelector('#order input[data-kind="choir-title"]');
  if (choirTi && run.choir_song) run.choir_song.title = choirTi.value.trim();
  const choirCo = document.querySelector('#order input[data-kind="choir-composer"]');
  if (choirCo && run.choir_song) run.choir_song.composer = choirCo.value.trim();
  // confession/sermonsong lyrics come from their label cards (the .cards loop above); only the
  // title/composer inputs need reading back here.
  [['confession', run.confession_song], ['sermonsong', run.worship_after_sermon]].forEach(([k, s]) => {
    if (!s) return;
    const ti = document.querySelector('#order input[data-kind="' + k + '-title"]');
    if (ti) s.title = ti.value.trim();
    const co = document.querySelector('#order input[data-kind="' + k + '-composer"]');
    if (co) s.composer = co.value.trim();
  });
  const annTa = document.querySelector('#order textarea[data-kind="ann"]');
  if (annTa) run.announcements = annTa.value.split(/\n-{3,}\n/).map(s => s.trim()).filter(Boolean);
  const hn = document.getElementById('hymnNumber');
  if (hn) run.offering_hymn_number = hn.value.trim();
  const ht = document.getElementById('hymnTitle');
  if (ht) run.offering_hymn_title = ht.value.trim();
  const exTa = document.querySelector('#order textarea[data-kind="extrarefs"]');
  if (exTa) run.sermon_extra_refs = splitLines(exTa.value);
}

async function save() {
  syncFromDom();
  const r = await fetch('/runs/' + date, {
    method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(run),
  });
  if (!r.ok) { saveLabel('저장 ✕'); showStatus('✕ 저장 오류: ' + r.status, true); return false; }
  const body = await r.json();
  if (body.warnings && body.warnings.length) showWarn(body.warnings.join('\n'));
  else document.getElementById('warnCard').hidden = true;
  document.getElementById('status').hidden = true;
  saveLabel('저장 ✓');
  await load();  // re-render so freshly looked-up extra sermon verses preview (#114)
  return true;
}

let _buildTimer;
async function generate() {
  const btn = document.getElementById('generate');
  // Persist edits first — the build reads the saved run store, not the page.
  if (!(await save())) return;
  btn.disabled = true;
  setStep('review', 'done'); setStep('build', 'active');
  showStatus('◐ 덱 생성 중… (Mac에서 1분쯤 걸립니다)');
  window.scrollTo({top: 0, behavior: 'smooth'});
  const r = await fetch('/runs/' + date + '/build', {method: 'POST'});
  const body = await r.json();
  if (!r.ok) {
    setStep('build', 'error');
    showStatus('✕ 빌드 오류: ' + (body.detail || r.status), true);
    btn.disabled = false;
    return;
  }
  clearInterval(_buildTimer);
  _buildTimer = setInterval(async () => {
    const s = await (await fetch(body.status_url)).json();
    if (s.status === 'running') return;
    clearInterval(_buildTimer);
    btn.disabled = false;
    if (s.status === 'done') {
      setStep('build', 'done');
      const dur = s.seconds ? ' • ' + fmtDur(s.seconds) : '';
      showStatus('● 완료' + dur + ' — ' + s.path + '\nKeynote에서 여는 중…');
      if (s.pdf) {  // tap to preview the rendered slides inline on the phone (#23)
        const a = document.createElement('a');
        a.href = s.pdf; a.target = '_blank'; a.className = 'pdf-link';
        a.textContent = '📄 PDF 미리보기';
        document.getElementById('status').append('\n', a);
      }
    } else {
      setStep('build', 'error');
      showStatus('✕ 빌드 실패: ' + (s.error || s.status), true);
    }
  }, 2000);
}

load();
</script>
</body>
