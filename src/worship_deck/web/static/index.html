<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Worship Deck — 준비</title>
<link rel="icon" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/app.css">
<style>
  body { padding-bottom: calc(6rem + var(--safe-bottom)); }  /* keep content above stickybar */
  .hint { color: var(--gray-600); font-size: 0.85rem; margin: 0.25rem 0; }
  .count { color: var(--green); font-size: 0.9rem; font-weight: 400; }
  textarea { width: 100%; min-height: 6rem; font-size: 1rem; box-sizing: border-box;
             margin-top: 0.5rem; }
  .filerow { display: flex; align-items: center; gap: 0.5rem; padding: 0.4rem 0;
             font-size: 1rem; }
  .filerow .ok { color: var(--green); font-weight: 700; flex: none; }
  .filerow .ok.warn { color: var(--amber); }
  .filerow .name { flex: 1; word-break: break-all; }
  .filerow .size { color: var(--gray-600); font-size: 0.85rem; flex: none; }
  .filerow .del { flex: none; padding: 0.4rem 0.7rem; font-size: 1rem; border: 0;
                  border-radius: var(--radius); background: var(--red); color: #fff; }
  .repick { margin-top: 0.25rem; padding: 0.5rem 0.8rem; font-size: 0.95rem;
            border: 1px solid var(--blue); border-radius: var(--radius);
            background: #fff; color: var(--blue); }
  #statusCard { color: var(--gray-600); white-space: pre-wrap; }
  #statusCard.err { color: var(--red); border-color: var(--red); }  /* outranks .card.err */
  #assemble.go { background: var(--blue); }
  #inbox { list-style: none; padding: 0; margin: 0; }
  #inbox li { border-bottom: 1px solid var(--gray-100); }
  #runs { list-style: none; padding: 0; margin: 0; }
  #runs li { padding: 0.5rem 0; border-bottom: 1px solid var(--gray-100); font-size: 1rem; }
  #runs a { color: var(--blue); text-decoration: none; }
  .more { font-size: 0.9rem; font-weight: 400; color: var(--blue); text-decoration: none; }
  .h2row { display: flex; align-items: center; gap: 0.5rem; }
  .reset { margin-left: auto; padding: 0.4rem 0.7rem; font-size: 0.9rem; font-weight: 400;
           border: 1px solid var(--red); border-radius: var(--radius);
           background: #fff; color: var(--red); }
</style>
</head>
<body>
<h1>Worship Deck</h1>
<div class="stepper">
  <span class="step" data-step="upload"><span class="dot">○</span>업로드</span>
  <span class="sep"></span>
  <span class="step" data-step="assemble"><span class="dot">○</span>Assemble</span>
  <span class="sep"></span>
  <span class="step" data-step="review"><span class="dot">○</span>검토</span>
  <span class="sep"></span>
  <span class="step" data-step="build"><span class="dot">○</span>빌드</span>
</div>

<div class="card" id="statusCard" hidden></div>
<div class="card warn" id="warnCard" hidden></div>

<h2 class="h2row"><span>이번 주 준비물 <span class="count" id="readyCount"></span></span>
  <button type="button" class="reset" onclick="resetWeek()">새 주 시작</button></h2>

<div class="card slotcard empty" id="slot-bulletin" onclick="pickSlot(event)">
  <div class="slothead"><span class="mark">⬜</span><span>주보 (PDF)</span></div>
  <div class="tap-hint">탭하여 업로드</div>
  <div class="files" id="files-bulletin"></div>
  <div class="sloterr" id="err-bulletin" hidden></div>
  <button type="button" class="repick when-filled" onclick="pickHere(event)">교체</button>
  <input type="file" accept=".pdf" hidden onchange="uploadSlot(this, 'bulletin')">
</div>

<div class="card slotcard empty" id="slot-sheet" onclick="pickSlot(event)">
  <div class="slothead"><span class="mark">⬜</span><span>찬양 악보 (이미지)</span>
    <span class="count" id="sheetCount"></span></div>
  <div class="hint">파일명 순서 = 메들리 순서</div>
  <div class="tap-hint">탭하여 업로드</div>
  <div class="files" id="files-sheet"></div>
  <div class="sloterr" id="err-sheet" hidden></div>
  <button type="button" class="repick when-filled" onclick="pickHere(event)">＋ 추가</button>
  <input type="file" multiple accept=".png,.jpg,.jpeg" hidden onchange="uploadSlot(this, 'sheets')">
</div>

<div class="card slotcard empty" id="slot-confession" onclick="pickSlot(event)">
  <div class="slothead"><span class="mark">⬜</span><span>고백의 찬양 악보 (이미지 1장)</span></div>
  <div class="tap-hint">탭하여 업로드</div>
  <div class="files" id="files-confession"></div>
  <div class="sloterr" id="err-confession" hidden></div>
  <button type="button" class="repick when-filled" onclick="pickHere(event)">교체</button>
  <input type="file" accept=".png,.jpg,.jpeg" hidden onchange="uploadSlot(this, 'confession')">
</div>

<div class="card slotcard" id="slot-choir">
  <div class="slothead"><span class="mark">⬜</span><span>성가대 가사 (텍스트)</span></div>
  <div class="hint">제목 / 작곡 줄 / 가사 — 절 사이 빈 줄 유지 · 자동 저장</div>
  <textarea id="choirText" oninput="choirChanged()" onblur="flushChoir()"></textarea>
  <div class="hint" id="choirStatus"></div>
</div>

<div id="otherWrap" hidden>
  <h2>⚠ 기타 파일</h2>
  <div class="hint">슬롯으로 인식되지 않아 빌드에 사용되지 않는 파일 — 삭제 후 위 슬롯으로 다시
    업로드</div>
  <ul id="inbox"></ul>
</div>

<h2>지난 실행 <a class="more" href="/history">전체 보기 →</a></h2>
<ul id="runs"></ul>

<div class="stickybar">
  <button type="button" class="secondary" id="reassemble" onclick="assemble()" hidden>다시
    Assemble</button>
  <button type="button" id="assemble" onclick="ctaClick()" disabled>Assemble</button>
</div>
<script>
function fmtDur(s) {
  const m = Math.floor(s / 60), sec = Math.round(s % 60);
  return m ? m + '분 ' + sec + '초' : sec + '초';
}
let _timer, _choirTimer;
let _phase = 'idle';   // idle | running | done — drives the CTA and stepper
let _doneDate = null;  // service date of the finished assemble (CTA → review link)
const _ready = {bulletin: false, sheet: false, confession: false, choir: false};
const DOTS = {empty: '○', active: '◐', done: '●', error: '✕'};

function setStep(name, state) {
  const el = document.querySelector('.step[data-step="' + name + '"]');
  el.className = 'step' + (state === 'empty' ? '' : ' ' + state);
  el.querySelector('.dot').textContent = DOTS[state];
}
function readyCount() { return Object.values(_ready).filter(Boolean).length; }
function updateReadiness() {
  document.getElementById('readyCount').textContent = readyCount() + ' / 4';
  if (_phase === 'idle') {
    setStep('upload', readyCount() === 4 ? 'done' : readyCount() ? 'active' : 'empty');
  }
  updateCta();
}
function updateCta() {
  const btn = document.getElementById('assemble');
  document.getElementById('reassemble').hidden = _phase !== 'done';
  btn.classList.toggle('go', _phase === 'done');
  if (_phase === 'running') { btn.disabled = true; btn.textContent = 'Assembling…'; return; }
  if (_phase === 'done') { btn.disabled = false; btn.textContent = '검토 화면으로 →'; return; }
  if (!_ready.bulletin) { btn.disabled = true; btn.textContent = 'Assemble — 주보 없음'; return; }
  btn.disabled = false;
  btn.textContent = 'Assemble — ' + readyCount() + '/4 준비';
}
function ctaClick() {
  if (_phase === 'done') { location.href = '/review/' + _doneDate; return; }
  assemble();
}

// Empty card = whole-card file picker; guard skips real controls and the input's own
// bubbled synthetic click. Filled cards pick via the 교체/＋ 추가 button instead.
function pickSlot(e) {
  if (e.target.closest('button, input, a, .filerow')) return;
  const card = e.currentTarget;
  if (!card.classList.contains('empty')) return;
  card.querySelector('input[type=file]').click();
}
function pickHere(e) {
  e.stopPropagation();
  e.target.closest('.slotcard').querySelector('input[type=file]').click();
}

function fileRow(f, tag, mark) {
  const row = document.createElement(tag); row.className = 'filerow';
  const ok = document.createElement('span'); ok.className = mark ? 'ok warn' : 'ok';
  ok.textContent = mark || '✓';
  const name = document.createElement('span'); name.className = 'name'; name.textContent = f.name;
  const size = document.createElement('span'); size.className = 'size'; size.textContent = (f.size / 1024).toFixed(1) + ' KB';
  const btn = document.createElement('button'); btn.className = 'del'; btn.textContent = '✕';
  btn.onclick = () => del(f.name);
  row.append(ok, name, size, btn);
  return row;
}
function setMark(kind, filled) {
  const card = document.getElementById('slot-' + kind);
  card.classList.toggle('filled', filled);
  if (kind !== 'choir') card.classList.toggle('empty', !filled);
  card.querySelector('.mark').textContent = filled ? '✓' : '⬜';
  _ready[kind] = filled;
}
async function loadInbox() {
  const {files, choir_text} = await (await fetch('/inbox')).json();
  const ta = document.getElementById('choirText');
  if (document.activeElement !== ta) ta.value = choir_text || '';
  for (const kind of ['bulletin', 'sheet', 'confession']) {
    const box = document.getElementById('files-' + kind);
    const mine = files.filter(f => f.kind === kind);
    box.innerHTML = '';
    for (const f of mine) box.appendChild(fileRow(f, 'div'));
    setMark(kind, mine.length > 0);
  }
  const sheets = files.filter(f => f.kind === 'sheet').length;
  document.getElementById('sheetCount').textContent = sheets ? sheets + '장' : '';
  setMark('choir', !!(choir_text || '').trim());
  const others = files.filter(f => f.kind === 'other');
  document.getElementById('otherWrap').hidden = !others.length;
  const ul = document.getElementById('inbox');
  ul.innerHTML = '';
  for (const f of others) ul.appendChild(fileRow(f, 'li', '?'));
  updateReadiness();
}
// New-week reset: empty the inbox and return the page to its idle state. Past runs
// (지난 실행 / review pages) are untouched — only next week's input slots are cleared.
async function resetWeek() {
  if (!window.confirm('새 주 준비를 시작할까요?\n업로드한 파일과 성가대 가사가 모두 삭제됩니다.\n(지난 실행 기록은 유지됩니다)')) return;
  await fetch('/inbox', {method: 'DELETE'});
  clearInterval(_timer);
  _phase = 'idle'; _doneDate = null;
  document.getElementById('statusCard').hidden = true;
  document.getElementById('warnCard').hidden = true;
  document.getElementById('choirStatus').textContent = '';
  setStep('assemble', 'empty'); setStep('review', 'empty'); setStep('build', 'empty');
  loadInbox();
}
async function del(name) {
  await fetch('/inbox/' + encodeURIComponent(name), {method: 'DELETE'});
  loadInbox();
}
async function uploadSlot(input, kind) {
  if (!input.files.length) return;
  const slot = {sheets: 'sheet'}[kind] || kind;  // upload kind → slot/card id
  const err = document.getElementById('err-' + slot);
  err.hidden = true;
  document.getElementById('slot-' + slot).classList.remove('error');
  const fd = new FormData();
  for (const f of input.files) fd.append('files', f);
  const r = await fetch('/upload/' + kind, {method: 'POST', body: fd});
  if (!r.ok) {  // rejection reason inside the slot, not a shared status line
    const body = await r.json().catch(() => ({}));
    err.textContent = '⚠ ' + (body.detail || '업로드 실패 (' + r.status + ')');
    err.hidden = false;
    document.getElementById('slot-' + slot).classList.add('error');
  }
  input.value = '';
  loadInbox();
}
function choirChanged() {
  document.getElementById('choirStatus').textContent = '…';
  clearTimeout(_choirTimer);
  _choirTimer = setTimeout(saveChoir, 800);
}
function flushChoir() {
  if (!_choirTimer) return;
  clearTimeout(_choirTimer);
  saveChoir();
}
async function saveChoir() {
  _choirTimer = null;
  const text = document.getElementById('choirText').value;
  const r = await fetch('/inbox/choir', {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({text}),
  });
  document.getElementById('choirStatus').textContent = r.ok
    ? (text.trim() ? '저장됨 ✓' : '비어 있음 — 저장 안 함') : '저장 오류: ' + r.status;
  setMark('choir', r.ok && !!text.trim());
  updateReadiness();
}
async function loadRuns() {
  const {runs} = await (await fetch('/runs')).json();
  const ul = document.getElementById('runs');
  ul.innerHTML = runs.length ? '' : '<li class="hint">(아직 없음 — 먼저 Assemble 하세요)</li>';
  for (const d of runs.slice(0, 3)) {  // short list — full history lives at /history
    const li = document.createElement('li');
    const a = document.createElement('a'); a.href = '/review/' + d; a.textContent = d + ' — 검토 →';
    li.appendChild(a);
    ul.appendChild(li);
  }
}
loadInbox();
loadRuns();

function showStatus(text, isErr) {
  const el = document.getElementById('statusCard');
  el.hidden = false;
  el.textContent = text;
  el.classList.toggle('err', !!isErr);
}
function showWarn(text) {
  const el = document.getElementById('warnCard');
  el.hidden = false;
  el.textContent = text.split('\n').map(w => '⚠ ' + w).join('\n');
}
async function assemble(confirm) {
  _phase = 'running';
  setStep('upload', 'done'); setStep('assemble', 'active'); setStep('review', 'empty');
  document.getElementById('warnCard').hidden = true;
  showStatus('시작 중…');
  updateCta();
  const r = await fetch('/assemble' + (confirm ? '?confirm=1' : ''), {method: 'POST'});
  const body = await r.json();
  if (!r.ok) {
    _phase = 'idle';
    setStep('assemble', 'error');
    showStatus('✕ 오류: ' + (body.detail || r.status), true);
    updateReadiness();
    return;
  }
  if (body.needs_confirm) {
    const bullets = (items, empty) => items && items.length
      ? items.map(k => ' • ' + k).join('\n') : ' • ' + empty;
    const msg = 'A run for ' + body.service_date + ' already exists. Re-assembling will:\n\n'
      + '↻ Refresh (overwrite from the bulletin):\n'
      + bullets(body.refresh, '(nothing)') + '\n\n'
      + '✓ Keep (your review edits):\n'
      + bullets(body.kept, '(none — no review edits saved yet)') + '\n\n'
      + 'Continue?';
    if (window.confirm(msg)) return assemble(true);
    _phase = 'idle';
    setStep('assemble', 'empty');
    showStatus('취소됨.');
    updateReadiness();
    return;
  }
  poll(body.status_url, body.service_date);
}
function poll(url, date) {
  clearInterval(_timer);
  _timer = setInterval(async () => {
    const s = await (await fetch(url)).json();
    if (s.status === 'done' || s.status === 'error') clearInterval(_timer);
    if (s.warning) showWarn(s.warning);
    if (s.status === 'done') {
      _phase = 'done'; _doneDate = date;
      setStep('assemble', 'done'); setStep('review', 'active');
      const dur = s.seconds ? ' • ' + fmtDur(s.seconds) : '';
      showStatus('✓ ' + date + ' assemble 완료' + dur + ' — 검토로 이동하세요');
      updateCta();
    } else if (s.status === 'error') {
      _phase = 'idle';
      setStep('assemble', 'error');
      showStatus('✕ 오류: ' + (s.error || ''), true);
      updateReadiness();
    } else {
      showStatus('◐ Assembling… (' + (s.step || s.status) + ')');
    }
  }, 2000);
}
</script>
</body>
</html>
