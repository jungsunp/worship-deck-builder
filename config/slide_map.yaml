# Slide map for the weekly worship deck.
#
# The deck is REGENERATED FRESH from a template each week. Slide numbers below are
# anchors in last week's reference deck (주일예배 -2026년5월17일.key, 170 slides) and
# describe section structure — sections like worship-song lyrics and announcements
# EXPAND based on how much content there is that week.
#
# render: how the slide is produced. The church builds slides as NATIVE Keynote text
# boxes (not flattened images), so the builder edits text in place.
#   native_text     = set the slide's native text runs; duplicate the slide per item
#                     for sections that expand (lyrics, announcements)
#   existing_image  = an image slide placed as-is (downloaded hymn pages, lead sheets,
#                     media) — the only non-text slides
#   manual          = inserted by a human in the review step

sections:
  intro_date:
    slides: [1, 2]
    changes: service date
    source: bulletin.date
    render: native_text

  worship_songs:            # 찬양
    slides: [6, 46]         # verified range (start_index 6, section_len 41); expands per song
    structure: "per song: blank-green separator + title slide + N lyric slides (<= 2 lines each)"
    # Green chroma-key lower-third banners (keyed out over the live camera feed). Per song:
    # a blank-green separator, then the title slide (narrow banner = Song.title), then the
    # ≤2-line lyric slides (wide banner). One blank before each song + a trailing blank.
    # keynote.build.fill_worship_songs fans the first 3-slide unit (blank/title/lyric) into
    # one per medley song. Anchors are master.key positions — re-verify if the template drifts.
    title_source: bulletin.worship_order
    lyrics_source: band_sheet_images   # shared in Kakao; often a multi-song medley.
    # Claude vision reads lyrics + red arrangement marks (V/C/B sections, ×N repeats,
    # X-out skips, → segues between songs); operator confirms order/skips in review.
    render: native_text

  call_to_worship:          # 예배의 부름
    slides:
      reference: 47
      verse_text: 48
    source: bulletin.worship_order   # reference only
    bible_versions: [개역한글, ESV]    # verse text fetched from Bible source
    render: native_text

  confession_song:          # 고백의 찬양
    slides: []
    automate: false
    note: "title changes weekly (bulletin row); lyrics transcribed from the uploaded
      sheet image at assemble (#109) — slide fill not yet automated"

  choir_song:               # 찬양 (성가대)
    slides:
      title: [77, 78]
      lyrics: [79, 95]
    title_source: choir_text   # title is the first line of the pasted text
    lyrics_source: choir_text   # raw text pasted in the review app (title + composer
    # line + lyric lines with real line breaks); not an image. No vision needed.
    render: native_text

  offering_hymn:            # 봉헌
    slides: [97, 106]
    title_slide: 97   # native-text title slide: "봉 헌" heading + "[ <title> ]" + "(찬 <N>장)";
    # filled by set_offering_hymn_title_slide from bulletin number/title (#106).
    title_source: bulletin.worship_order   # 찬송가 number / title / verses
    note: "always a 찬송가 hymn"
    lyrics_source: online_download   # download a 찬송가 PPT per song from bibletoppt.com
    # (token API, design "no-bg"; see hymn.py), convert ALL slides -> PNG. No local hymn
    # directory. Slides are flat images, so verses are dropped by the operator in review (#25).
    render: existing_image   # hymn PAGES are images; the title slide (97) is native text

  announcements:            # 교회소식
    slides: [117, 121]      # one announcement item per slide; expands
    source: bulletin.announcements
    render: native_text

  sermon:                   # 말씀
    slides:
      reference: 127
      verse_text: [129, 132]
      title: 134
    source: bulletin.sermon
    bible_versions: [개역한글, ESV]
    render: native_text
    special_slides:
      slides: [135, 152]   # ad-hoc block (18 slides); DELETED on a fresh build (#97)
      note: "last week's pastor-requested slides (messages/images/videos/lyrics), between the
        말씀 title slide and the 파송의 노래/축도/주기도문 closing. Never recur, so build() drops
        them; the operator adds this week's specials manually in review. Re-verify range on
        master.key replacement (#98)."
      render: manual

  ending_date:
    slides: [167, 168]
    changes: service date
    source: bulletin.date
    # Static wording differs from intro (예배를 마칩니다 / closing line) but the same
    # date / sermon-title swap applies. Two slides: 1부 and 2부.
    render: native_text
