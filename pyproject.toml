[project]
name = "worship-deck-builder"
version = "0.1.0"
description = "Automates the weekly Keynote worship deck for a Sunday worship service"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber",      # bulletin PDF parsing
    "httpx",           # ESV API + local Ollama (lyric reassembly) + general HTTP
    "pyyaml",          # slide_map.yaml
    "fastapi",         # mobile review/trigger web app
    "uvicorn",         # ASGI server
    "python-multipart",# file uploads in the web app
    "protobuf",        # read/write ProPresenter .pro files (v3 migration, #165)
]

[project.optional-dependencies]
# playwright + Pillow are only used by scripts/make_fixtures.py to generate the
# pdfplumber-readable sample-bulletin fixture PDF — not by the runtime pipeline.
dev = ["pytest", "ruff", "Pillow", "playwright"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worship_deck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["local_only: requires a Mac with Keynote; skipped in CI"]

[tool.ruff]
line-length = 100
# Generated protobuf bindings (scripts/gen_proto.sh) — don't lint machine output.
extend-exclude = ["src/worship_deck/propresenter/pb"]

# No `select` on purpose (#217): the repo tracks ruff's DEFAULT rule set, which widens on
# minor releases, so new checks arrive for free. The cost is that a release can redden CI on
# untouched files (0.16.0 did, with 44 errors) — the /ship agent classifies that case by
# checking whether the violations are outside the PR's diff, and files an issue instead of
# blaming the change.
[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency injection *is* calls in argument defaults (Body/File/Depends).
"src/worship_deck/web/app.py" = ["B008"]
